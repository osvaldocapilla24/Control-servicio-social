<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | Servicio Social</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="calendario.css" />
    <link rel="stylesheet" href="hora.css" />
    <link rel="stylesheet" href="select.css" />
  </head>

  <body>
    <main class="page">
      <section class="card">
        <div class="header header-registro">
          <button type="button" id="btnVolverRegistro" class="volver-text">
            Regresar al inicio
          </button>

          <div class="logo">BUAP</div>
          <h1 id="tituloRegistro">Registro de Prestador</h1>
          <p id="descripcionRegistro">
            Regístrate una sola vez para comenzar a registrar tus horas de
            servicio social.
          </p>
        </div>

        <form id="formRegistro" class="form">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Ejemplo: José Aldo" />

          <label for="matricula">Matrícula</label>
          <input type="text" id="matricula" placeholder="Ejemplo: 202345678" />

          <label for="carrera">Carrera</label>
          <select id="carrera">
            <option value="">Selecciona una carrera</option>
            <option value="Ingeniería en Tecnologías de la Información">
              Ingeniería en Tecnologías de la Información
            </option>
            <option value="Ingeniería en Ciencias de la Computación">
              Ingeniería en Ciencias de la Computación
            </option>
            <option value="Licenciatura en Ciencias de la Computación">
              Licenciatura en Ciencias de la Computación
            </option>
            <option value="Administración">Facultad de Administración</option>
          </select>

          <label>Días de servicio</label>

          <div class="dias-grid">
            <label class="check-option">
              <input type="checkbox" name="diasServicio" value="Lunes" />
              Lunes
            </label>

            <label class="check-option">
              <input type="checkbox" name="diasServicio" value="Martes" />
              Martes
            </label>

            <label class="check-option">
              <input type="checkbox" name="diasServicio" value="Miércoles" />
              Miércoles
            </label>

            <label class="check-option">
              <input type="checkbox" name="diasServicio" value="Jueves" />
              Jueves
            </label>

            <label class="check-option">
              <input type="checkbox" name="diasServicio" value="Viernes" />
              Viernes
            </label>

            <label class="check-option">
              <input type="checkbox" name="diasServicio" value="Sábado" />
              Sábado
            </label>

            <label class="check-option">
              <input type="checkbox" name="diasServicio" value="Domingo" />
              Domingo
            </label>
          </div>

          <div class="horario-grid">
            <div>
              <label for="horaEntradaServicio">Hora de entrada</label>
              <input type="time" id="horaEntradaServicio" />
            </div>

            <div>
              <label for="horaSalidaServicio">Hora de salida</label>
              <input type="time" id="horaSalidaServicio" />
            </div>
          </div>

          <label class="label-seccion">Periodo de servicio social</label>

          <div class="periodo-servicio-grid">
            <div class="campo-periodo">
              <label for="periodoServicio">Periodo</label>
              <select id="periodoServicio">
                <option value="Primavera">Primavera</option>
                <option value="Verano">Verano</option>
                <option value="Otoño">Otoño</option>
              </select>
            </div>

            <div class="campo-anio">
              <label for="anioPeriodoServicio">Año</label>
              <select id="anioPeriodoServicio">
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
                <option value="2031">2031</option>
                <option value="2032">2032</option>
                <option value="2033">2033</option>
                <option value="2034">2034</option>
                <option value="2035">2035</option>
                <option value="2036">2036</option>
                <option value="2037">2037</option>
                <option value="2038">2038</option>
                <option value="2039">2039</option>
                <option value="2040">2040</option>
                <option value="2031">2041</option>
                <option value="2032">2042</option>
                <option value="2033">2043</option>
                <option value="2034">2044</option>
                <option value="2035">2045</option>
                <option value="2036">2046</option>
                <option value="2037">2047</option>
                <option value="2038">2048</option>
                <option value="2039">2049</option>
                <option value="2040">2050</option>
              </select>
            </div>
          </div>

          <label for="horas_requeridas">Horas requeridas</label>
          <input type="number" id="horas_requeridas" value="480" />

          <button type="submit" id="btnRegistrarPrestador">Registrarme</button>
        </form>

        <p id="mensaje" class="mensaje"></p>

        <a href="index.html" class="link-regresar-inicio"
          >Ya estoy registrado</a
        >
      </section>
    </main>

    <script src="registro.js"></script>
    <script src="calendario.js"></script>
    <script src="hora.js"></script>
    <script src="select.js"></script>
  </body>
</html>
